[package]
name = "mitmproxy-mcp-rs"
version = "0.2.0"
edition = "2021"
description = "命令行版 mitmproxy MCP server（Rust），面向 app 抓包与签名逆向分析"
license = "GPL-3.0-or-later"

[dependencies]
# MCP（stdio）
rmcp = { version = "1.7", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"

# MITM 抓包代理：rcgen 自签 CA + rustls 客户端 + 响应解压 + http2，不引入 openssl
hudsucker = { version = "0.24", default-features = false, features = [
    "decoder",
    "rcgen-ca",
    "rustls-client",
    "http2",
] }
rcgen = "0.14"
# 让整个依赖图的 aws-lc-rs 走 prebuilt-nasm，规避本机缺少 nasm
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }

# 重放：rustls + 自动解压
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
] }

# 存储
rusqlite = { version = "0.32", features = ["bundled"] }

# 运行时 / 序列化 / 工具
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# codec / analysis
base64 = "0.22"
hex = "0.4"
flate2 = "1"
regex = "1"
url = "2"
percent-encoding = "2"
bytes = "1"
http-body-util = "0.1"
dirs = "5"

[profile.release]
opt-level = 2
